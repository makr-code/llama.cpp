name: ThemisDB reviewed upstream update

on:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
    inputs:
      validation_only:
        description: "Test current-base candidate, CPU tests and draft PR only; do not update upstream"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: themisdb-upstream-review
  cancel-in-progress: false

jobs:
  candidate:
    if: github.repository == 'makr-code/llama.cpp' && github.ref == 'refs/heads/themisdb'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.merge.outputs.changed }}
      sha: ${{ steps.merge.outputs.sha }}
      upstream: ${{ steps.merge.outputs.upstream }}
      base: ${{ steps.merge.outputs.base }}
      validation_only: ${{ steps.merge.outputs.validation_only }}
      conflicts: ${{ steps.merge.outputs.conflicts }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: themisdb
          fetch-depth: 0
          persist-credentials: false
      - name: Bound fork patch and merge upstream into candidate
        id: merge
        shell: bash
        env:
          VALIDATION_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validation_only }}
        run: |
          set -euo pipefail
          git config user.name "themisdb-upstream-review"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          timeout 180 git fetch --no-tags https://github.com/ggml-org/llama.cpp.git master
          upstream=$(git rev-parse FETCH_HEAD)
          base=$(git rev-parse HEAD)
          ancestor=$(git merge-base HEAD "$upstream")
          echo "Upstream master: $upstream; current patch ancestor: $ancestor; fork base: $base"
          if [ "$VALIDATION_ONLY" = "true" ]; then
            # Exercise the unchanged candidate/build/publication path without
            # adopting newer upstream commits just to test automation.
            upstream="$ancestor"
            echo "VALIDATION ONLY: current upstream ancestor; draft PR must not be merged."
          fi
          export UPSTREAM="$upstream" BASE="$base" ANCESTOR="$ancestor"
          python3 - <<'PY'
          import os, subprocess
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"upstream={os.environ['UPSTREAM']}\nbase={os.environ['BASE']}\n")
          ancestor = os.environ["ANCESTOR"]
          allowed = {
              "include/llama.h", "src/llama-adapter.cpp", "src/llama-context.cpp",
              "src/llama-context.h", "src/llama-graph.cpp", "src/llama-graph.h",
              "src/models/llama.cpp", "tests/CMakeLists.txt", "tests/test-lora-train.cpp",
              "docs/themisdb-training.md", ".github/workflows/themisdb-upstream-review.yml",
          }
          # Check the net fork delta against the latest common upstream
          # ancestor, not each merge commit's first-parent upstream changes.
          # This remains valid after normal reviewed GitHub merge promotion.
          paths = set(subprocess.check_output(
              ["git", "diff", "--name-only", "-z", ancestor, "HEAD"], text=True).rstrip("\0").split("\0"))
          paths.discard("")
          if not paths or paths - allowed:
              raise SystemExit(f"Expected focused fork delta; out-of-scope paths: {paths - allowed}")
          PY
          if [ "$ancestor" = "$upstream" ] && [ "$VALIDATION_ONLY" != "true" ]; then
            python3 -c 'import os; open(os.environ["GITHUB_OUTPUT"], "a").write("changed=false\n")'
            echo "No new upstream commits; no update PR needed."
            exit 0
          fi
          git switch -c themisdb-candidate
          if ! timeout 180 git -c core.hooksPath=/dev/null merge --no-ff --no-edit "$upstream"; then
            echo "::error::Upstream merge conflicted or timed out. No branch/PR published; resolve manually."
            git status --short
            git diff --name-only --diff-filter=U
            python3 - <<'PY'
          import json, os, subprocess
          conflicts = subprocess.check_output(
              ["git", "diff", "--name-only", "--diff-filter=U"], text=True).splitlines()
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write("conflicts=" + json.dumps(conflicts) + "\n")
          PY
            git merge --abort || true
            exit 1
          fi
          git merge-base --is-ancestor "$base" HEAD
          git merge-base --is-ancestor "$upstream" HEAD
          # A documentation-only difference makes the smoke-test PR reviewable.
          # No model artifact, training context or runtime code is added.
          python3 - <<'PY'
          import os, subprocess
          if os.environ["VALIDATION_ONLY"] == "true":
            with open("docs/themisdb-training.md", "a") as out:
                out.write("\n## Validation-only updater candidate\n\n"
                          f"Automation smoke test run {os.environ['GITHUB_RUN_ID']}. "
                          "Current-base candidate only; no upstream update or promotion. "
                          "**Do not merge this validation-only draft PR.**\n")
            subprocess.run(["git", "add", "docs/themisdb-training.md"], check=True)
            subprocess.run(["git", "-c", "core.hooksPath=/dev/null", "commit", "-m",
                            "docs: mark validation-only updater candidate (do not merge)"], check=True)
          PY
          sha=$(git rev-parse HEAD)
          export CANDIDATE_SHA="$sha"
          python3 - <<'PY'
          import os
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              for key, val in (("changed", "true"), ("sha", os.environ["CANDIDATE_SHA"]),
                               ("upstream", os.environ["UPSTREAM"]), ("base", os.environ["BASE"]),
                               ("validation_only", os.environ["VALIDATION_ONLY"])):
                  out.write(f"{key}={val}\n")
          PY
          # Export code/history only, before running any upstream build logic.
          git bundle create "$RUNNER_TEMP/themisdb-candidate.bundle" themisdb-candidate "^$ancestor"
      - name: Build CPU training regression (no write credentials)
        if: steps.merge.outputs.changed == 'true'
        run: |
          cmake -S . -B build-review -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF -DLLAMA_BUILD_TESTS=ON \
            -DLLAMA_BUILD_TOOLS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF \
            -DLLAMA_HTTPLIB=OFF -DLLAMA_OPENSSL=OFF -DGGML_CCACHE=OFF \
            -DGGML_NATIVE=OFF -DGGML_CPU_REPACK=OFF -DGGML_CUDA=OFF -DGGML_VULKAN=OFF -DGGML_BLAS=OFF
          cmake --build build-review --target test-lora-train --parallel 2
          ctest --test-dir build-review --no-tests=error -R '^lora-train$' --output-on-failure
      - name: Transfer tested candidate code only
        if: steps.merge.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: themisdb-candidate
          path: ${{ runner.temp }}/themisdb-candidate.bundle
          if-no-files-found: error
          retention-days: 7
      - name: Explicit failure evidence
        if: failure()
        run: |
          echo "::error::Candidate fetch/scope/merge/build/test failed. No update branch or PR is published."
          python3 - <<'PY'
          import os
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("## Upstream update blocked\nSee failed step logs for fetch, scope, conflict or test evidence. "
                        "No candidate promotion or automatic merge occurred. Human intervention is required.\n")
          PY

  publish:
    needs: candidate
    if: needs.candidate.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: themisdb
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: themisdb-candidate
          path: ${{ runner.temp }}/candidate
      - name: Publish tested candidate and draft review PR
        # A fresh runner: no upstream candidate scripts execute with this token.
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.candidate.outputs.sha }}
          UPSTREAM_SHA: ${{ needs.candidate.outputs.upstream }}
          BASE_SHA: ${{ needs.candidate.outputs.base }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_REPO: ${{ github.repository }}
          VALIDATION_ONLY: ${{ needs.candidate.outputs.validation_only }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$BASE_SHA" || {
            echo "::error::themisdb moved during validation; rerun instead of publishing stale evidence."
            exit 1
          }
          git -c core.hooksPath=/dev/null fetch "$RUNNER_TEMP/candidate/themisdb-candidate.bundle" themisdb-candidate
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_SHA"
          git merge-base --is-ancestor "$BASE_SHA" "$EXPECTED_SHA"
          git merge-base --is-ancestor "$UPSTREAM_SHA" "$EXPECTED_SHA"
          branch="upstream-review/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          title="Review upstream llama.cpp update ${UPSTREAM_SHA:0:12}"
          purpose="Merged upstream master $UPSTREAM_SHA into a candidate descended from themisdb. After review and any required revalidation, promote with a normal GitHub merge commit (not squash/rebase)."
          if [ "$VALIDATION_ONLY" = "true" ]; then
            title="[Validation only] updater CPU tests and draft-PR smoke test"
            purpose="VALIDATION ONLY: built a descendant of themisdb against current upstream ancestor $UPSTREAM_SHA. No newer upstream commits adopted; merging that existing ancestor is a no-op. Do not merge or promote this draft PR."
          fi
          gh auth setup-git
          git -c core.hooksPath=/dev/null push origin "$EXPECTED_SHA:refs/heads/$branch"
          gh pr create --repo "$GH_REPO" --base themisdb --head "$branch" --draft \
            --title "$title" \
            --body "$purpose

          Candidate: $EXPECTED_SHA; previous themisdb: $BASE_SHA.
          Evidence: $RUN_URL (Release CPU build target test-lora-train and CTest lora-train passed before this PR).

          GITHUB_TOKEN-created PRs do not trigger normal PR workflows. This evidence covers only the generated F32/Q4_0 dense-Llama fixture, not GPUs, other architectures, production model quality or ThemisDB integration. Review code and workflow changes manually; rerun validation after edits or base changes. For real update PRs use normal merge, not squash/rebase, to preserve upstream ancestry for the next update. No automatic merge."
      - name: Report publication/permission failure
        if: failure()
        run: |
          echo "::error::Draft PR publication failed. Check logs and repository workflow PR-creation permission; a candidate branch may exist. No automatic merge."

  report-blocked:
    needs: candidate
    if: failure() && needs.candidate.result == 'failure'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Report actual conflicts or validation failure to maintainers
        # No checkout or candidate code on this runner; issue-write only.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          UPSTREAM_SHA: ${{ needs.candidate.outputs.upstream }}
          BASE_SHA: ${{ needs.candidate.outputs.base }}
          CONFLICTS_JSON: ${{ needs.candidate.outputs.conflicts }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          repo = os.environ["GH_REPO"]
          title = "[ThemisDB updater] upstream update blocked"
          conflicts = json.loads(os.environ["CONFLICTS_JSON"] or "[]")
          details = ("Actual upstream merge conflicts:\n" + "\n".join(f"- `{path}`" for path in conflicts)
                     if conflicts else "Fetch, scope, timeout or candidate build/test failure; see failed step logs.")
          body = (f"Updater blocked: {os.environ['RUN_URL']}\n\n"
                  f"Upstream target: `{os.environ['UPSTREAM_SHA'] or 'unavailable'}`\n"
                  f"Fork base: `{os.environ['BASE_SHA'] or 'unavailable'}`\n\n{details}\n\n"
                  "No update branch or draft PR was published by this failed candidate job. "
                  "No automatic merge or promotion. Human review/intervention is required.")
          issues = json.loads(subprocess.check_output(
              ["gh", "issue", "list", "--repo", repo, "--state", "open", "--search", title,
               "--json", "number,title"], text=True))
          existing = next((issue for issue in issues if issue["title"] == title), None)
          if existing:
              command = ["gh", "issue", "comment", str(existing["number"]), "--repo", repo, "--body", body]
          else:
              command = ["gh", "issue", "create", "--repo", repo, "--title", title, "--body", body]
          subprocess.run(command, check=True)
          PY
